# Publishes the browser app (web/) to GitHub Pages on every push to main.
# One-time setup: repository Settings → Pages → Build and deployment →
# Source: "GitHub Actions".
name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "sample_data/**", "scripts/update_fx_rates.py", ".github/workflows/pages.yml"]
  workflow_dispatch:
  # Monthly redeploy so new SNB rates (e.g. the 31.12. rate in January) land automatically.
  schedule:
    - cron: "17 6 5 * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs (as in GitHub's Pages starter
  # workflow): the deploy job only starts once the artifact upload is fully
  # finalized, otherwise deploy-pages can report "Found 0 artifact(s)".
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Smoke test (Swissquote, generic bank, IBKR, Revolut → eCH-0196 XML)
        run: |
          node web/cli.js sample_data/sample_swissquote.csv 2025 GR | grep -q "<taxStatement"
          node web/cli.js sample_data/sample_generic_bank.csv 2025 BE | grep -q 'isin="CH0038863350"'
          node web/cli.js sample_data/sample_ibkr_activity.csv 2025 ZH | grep -q 'isin="US0378331005"'
          node web/cli.js sample_data/sample_revolut_trading.csv 2025 ZH | grep -q "<taxStatement"

      - name: Refresh exchange rates (SNB data portal)
        # Keeps the committed web/fx-rates.js if the SNB is not reachable.
        run: python3 scripts/update_fx_rates.py || echo "::warning::SNB nicht erreichbar – eingecheckte Kurse werden verwendet"

      - name: Build site
        run: |
          mkdir -p _site
          cp -R web/. _site/
          rm -f _site/cli.js _site/README.md
          touch _site/.nojekyll
          # New cache version per deploy so installed apps pick up updates.
          sed -i "s/__BUILD__/${GITHUB_SHA::12}/" _site/sw.js
          du -sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
